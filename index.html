<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <title>Cedarism</title>

        <link rel="stylesheet" href="styles.css">

        <script src="main.js" defer></script>

        <link rel="icon" type="image/png" href="images/cedarismCrest.svg">
    </head>
    <body>

        <img class="crest" src="images/cedarismCrest.svg" alt="CedarismCrest">

        <div class="title">
            <h1>Cedarism Books</h1>
            <p>More translations coming soon</p>
        </div>

        <div class="home-row-container">
            <button class="button" type="button" id="biosButton">Bios</button>
            <button class="button" type="button" id="homeButton">Home</button>
            <button class="button" type="button" id="worshipButton">Worship</button>
        </div>

        <div class="books">
            <button class="button" type="button" id="bookOne">Primi Dies Terrae</button>
            <button class="button" type="button" id="bookTwo">Divinae Leges</button>
            <button class="button" type="button" id="bookThree">Malum Surgit</button>
        </div>

        <div class="book-container">
            <iframe class="current-book" id="bookContainer" title="current book" src="pages/cedarismDefinition.html"></iframe>
            <div class="chapter-selector-book1">
                <button class="chapterButton" type="button" id="selector-1-b1">CH 1</button>
                <button class="chapterButton" type="button" id="selector-2-b1">CH 2</button>
                <button class="chapterButton" type="button" id="selector-3-b1">CH 3</button>
                <button class="chapterButton" type="button" id="selector-4-b1">CH 4</button>
            </div>
            <div class="chapter-selector-book2">
                <button class="chapterButton" type="button" id="selector-1-b2">CH 1</button>
                <button class="chapterButton" type="button" id="selector-2-b2">CH 2</button>
                <button class="chapterButton" type="button" id="selector-3-b2">CH 3</button>
            </div>
            <div class="chapter-selector-book3">
                <button class="chapterButton" type="button" id="selector-1-b3">CH 1</button>
                <button class="chapterButton" type="button" id="selector-2-b3">CH 2</button>
                <button class="chapterButton" type="button" id="selector-3-b3">CH 3</button>
                <button class="chapterButton" type="button" id="selector-4-b3">CH 4</button>
            </div>
        </div>
    </body>
</html>
